<title>{{TITLE}} @ {{COMPANY}}</title><meta content="Software Engineer, AI Connections (Developer Platform) @ {{COMPANY}}" name="title"/>
<meta content="WHO WE ARE
{{COMPANY}} is the collaborative AI workspace where teams and agents think together https://www.youtube.com/watch?v=vkpYpWfEK5s. We're building one place where your knowledge, projects, meetings, and AI tools live side by side, so work is faster, clearer, and less fragmented. Millions of individuals, small teams, and large companies run their work on {{COMPANY}}.
Notinos (our employees) are customer zero in bringing this future of work to life. We care about craft, building things that last, and the belief that great work is still fundamentally human. Our goal isn’t to ship the next feature. Each and every team of Notinos is working to set the standard for how humans work together in the AI era. From building a business’s system of record to making and managing AI agents to automating away the busy work, we care deeply about giving our customers more time for their life’s work.
ABOUT THE ROLE:
As a Developer Platform https://www.{{COMPANY_SLUG}}.com/product/dev engineer, you will directly contribute to the foundational pieces that make {{COMPANY}} extensible and connected. You will build tools, APIs, and platform experiences that help customers connect {{COMPANY}} to the world — bringing their apps, data, and workflows into one workspace. Your work will make it easier for developers, admins, and builders to create reliable integrations and automations on top of {{COMPANY}}.
You will be a key player in building the robust technical foundation that allows {{COMPANY}} to achieve the connected workspace vision. Your work will include both internal platform contributions that accelerate other {{COMPANY}} engineering teams and end-user-facing functionality that enables toolmaking ubiquity. You will be presented with challenging technical problems, as {{COMPANY}}’s product needs are complex. You’ll play a key role in identifying and executing against technical investments that ensure the long-term quality, reliability, and performance of {{COMPANY}}’s platform as we scale.
This role can be based in either San Francisco or New York City. We work from our offices on Mondays, Tuesdays and Thursdays (our Anchor Days) because we do our best thinking and building together in person. We’re looking for someone who’s excited to work alongside the team during those days. 
WHAT YOU'LL ACHIEVE:
 - You’ll work with a team of engineers and cross-functional partners across product, design, data science, and user research to define a product strategy and drive execution through conception, research, implementation, and maintenance.
 - You’ll evolve Developer Platform capabilities across APIs, MCP tools, and integration infrastructure that help customers automate workflows, customize {{COMPANY}}, and connect {{COMPANY}} to the tools and data they use every day.
 - You’ll contribute to the overall performance, reliability, and robustness of the {{COMPANY}} product, ensuring it scales elegantly across many dimensions.
 - You’ll partner with engineering leaders to identify and execute against high-leverage technical investments that ensure the long-term flexibility and sustainability of our core systems.
SKILLS YOU'LL NEED TO BRING: 
 - 10+ years of experience shipping production software, with a strong track record of owning features end-to-end
 - Fluency with TypeScript across both backend and frontend
 - Strong product instincts: you can take a vague problem, propose a solid technical approach, and know when to cut scope
 - You don’t need to be an AI expert, but you’re curious and willing to adopt AI tools to work smarter and deliver better results
NICE TO HAVES:
 - Experience building developer tools like APIs and SDKs
 - Experience driving teams toward shared goals and balancing business priorities with individuals’ strengths, areas of interest, and career development goals
 - Familiarity with AI/agent tooling, evals, or LLM-driven product experiences
{{COMPANY}} is committed to providing highly competitive cash compensation, equity, and benefits. The compensation offered for this role will be based on multiple factors such as location, the role’s scope and complexity, and the candidate’s experience and expertise, and may vary from the range provided below. For roles based in San Francisco or New York City, the estimated base salary range for this role is $272,000 – $304,000 per year.
By clicking “Submit Application”, I understand and agree that {{COMPANY}} and its affiliates and subsidiaries will collect and process my information in accordance with {{COMPANY}}’s Global Recruiting Privacy Policy https://{{COMPANY_SLUG}}.{{COMPANY_SLUG}}.site/{{COMPANY}}-Global-Recruiting-Privacy-Policy-fc3eb4e829354a26a2bb6fd5e289b550?pvs=74 and NYLL 144 https://{{COMPANY_SLUG}}.{{COMPANY_SLUG}}.site/Ashby-AI-Bias-Audit-2b0efdeead05803bbbfae159ec86c528.
#LI-Onsite
A NOTE ON AI
You don’t need deep AI expertise for every role, but we do expect every Notino to be intellectually curious, drawn to tinkering and discovery, and excited to use AI as a real collaborator in their work. For some roles, AI fluency is a core requirement — when that’s the case, we'll say so explicitly in the qualifications. People who thrive here don’t treat AI as a novelty. They use it to think better, and make their work easier for others to build on.
EQUAL OPPORTUNITY &amp; ACCOMMODATIONS
We hire talented people from a wide range of backgrounds. If you’re excited about this role but don’t meet every bullet, we still encourage you to apply. {{COMPANY}} is an equal opportunity employer and does not discriminate on the basis of any legally protected characteristic. Consistent with applicable law, we will consider for employment qualified applicants with arrest and conviction records. {{COMPANY}} provides reasonable accommodations during the application process; if you need one, please let your recruiter know.
{{COMPANY}} is proud to be an equal opportunity employer. We do not discriminate in hiring or any employment decision based on race, color, religion, national origin, age, sex (including pregnancy, childbirth, or related medical conditions), marital status, ancestry, physical or mental disability, genetic information, veteran status, gender identity or expression, sexual orientation, or other applicable legally protected characteristic. {{COMPANY}} considers qualified applicants with criminal histories, consistent with applicable federal, state and local law. {{COMPANY}} is also committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If you need assistance or an accommodation due to a disability, please let your recruiter know." name="description"/>
